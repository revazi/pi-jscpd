name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install trusted-publishing compatible npm
        run: npm install --global --ignore-scripts npm@11.6.2

      - name: Verify release tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(node -p "Boolean(require('./package.json').private)")" = "false"
          test "$(node -p "require('./package-lock.json').version")" = "$PACKAGE_VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$PACKAGE_VERSION"
          grep -F "## [$PACKAGE_VERSION]" CHANGELOG.md
          test "$(npm --version)" = "11.6.2"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release
        run: npm run release:check

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
