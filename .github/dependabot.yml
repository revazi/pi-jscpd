version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Effect is intentionally excluded: its exact pin changes only in a focused
    # architecture and supported-Node compatibility review.
    allow:
      - dependency-name: "@earendil-works/pi-*"
      - dependency-name: "@biomejs/biome"
      - dependency-name: "@types/node"
      - dependency-name: typescript
      - dependency-name: vitest
    ignore:
      - dependency-name: "@earendil-works/pi-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "@biomejs/biome"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
    groups:
      pi-0-84-patches:
        patterns:
          - "@earendil-works/pi-*"
      development-tooling:
        dependency-type: development
        patterns:
          - "@biomejs/biome"
          - "@types/node"
          - typescript
          - vitest
    labels:
      - dependencies
    reviewers:
      - revazi

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    reviewers:
      - revazi
